<style>
  .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bar { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
  .node { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: 0.35; r: 3; } 50% { opacity: 1; r: 4.2; } }
  .rule { animation: sweep 6s ease-in-out infinite; }
  @keyframes sweep { 0% { width: 0; opacity: 0; } 18% { opacity: 1; } 70% { width: 176px; opacity: 1; } 100% { width: 176px; opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .bar, .node, .rule { animation: none; } .rule { width: 176px; } }
</style>
